project:
  name: twitter_sentiment_analysis
  random_seed: 42

paths:
  raw_data: data/raw
  processed_data: data/processed
  sample_data: data/sample/training_sample.csv
  models_dir: models
  outputs_dir: outputs

preprocessing:
  remove_urls: true
  remove_mentions: true
  remove_hashtags: false
  expand_contractions: true
  use_stemming: false
  use_lemmatization: true

features:
  method: tfidf
  max_features: 10000
  ngram_range: [1, 2]
  min_df: 2
  max_df: 0.95

training:
  test_size: 0.2
  cv_folds: 5
  models:
    - logistic_regression
    - multinomial_nb
    - linear_svc
  default_model: logistic_regression

twitter:
  max_results: 100
  tweet_fields:
    - created_at
    - lang
    - public_metrics
